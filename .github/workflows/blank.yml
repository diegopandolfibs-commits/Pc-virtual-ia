name: PC Virtual Ubuntu

on:
  workflow_dispatch:
    inputs:
      access_password:
        description: "Senha do PC virtual"
        required: true
        default: "123456"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      - name: Instalar desktop e RDP
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xfce4-session \
            xrdp \
            dbus-x11

      - name: Criar usuário
        run: |
          sudo useradd -m -s /bin/bash remote || true

          echo "remote:${{ github.event.inputs.access_password }}" \
            | sudo chpasswd

          sudo usermod -aG sudo remote
          sudo usermod -aG ssl-cert xrdp

      - name: Configurar XFCE
        run: |
          sudo -u remote bash -c 'cat > ~/.xsession <<EOF
          #!/bin/bash
          startxfce4
          EOF'

          sudo chmod +x /home/remote/.xsession
          sudo chown remote:remote /home/remote/.xsession

      - name: Configurar xRDP
        run: |
          sudo sed -i 's/^test -x/#test -x/' /etc/xrdp/startwm.sh
          sudo sed -i 's/^exec/#exec/' /etc/xrdp/startwm.sh

          sudo bash -c 'cat >> /etc/xrdp/startwm.sh <<EOF

          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg
          export XDG_DATA_DIRS=/usr/share/xfce4:/usr/share:/usr/local/share

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          exec startxfce4
          EOF'

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: Instalar Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Conectar ao Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="github-pc"

      - name: Mostrar dados de acesso
        run: |
          sleep 5

          IP=$(tailscale ip -4)

          echo ""
          echo "=========================================="
          echo "          PC VIRTUAL ONLINE"
          echo "=========================================="
          echo ""
          echo "PC NAME:"
          echo "$IP"
          echo ""
          echo "PORTA:"
          echo "3389"
          echo ""
          echo "USUÁRIO:"
          echo "remote"
          echo ""
          echo "SENHA:"
          echo "A senha definida no Run workflow"
          echo ""
          echo "=========================================="

      - name: Manter PC ligado
        run: |
          while true; do
            echo "PC virtual online - $(date)"
            sleep 60
          done
