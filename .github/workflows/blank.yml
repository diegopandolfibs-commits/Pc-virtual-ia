name: PC Virtual Ubuntu

on:
  workflow_dispatch:
    inputs:
      access_password:
        description: "Defina a senha para acessar o PC virtual"
        required: true
        default: "123456"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      - name: Instalar XFCE e xRDP
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            dbus-x11

      - name: Criar usuário remoto
        run: |
          sudo useradd -m -s /bin/bash remote || true

          echo "remote:${{ github.event.inputs.access_password }}" \
            | sudo chpasswd

          sudo usermod -aG sudo remote

      - name: Configurar XFCE para xRDP
        run: |
          echo "startxfce4" | sudo tee /home/remote/.xsession

          sudo chown remote:remote /home/remote/.xsession

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: Instalar Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Conectar ao Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="github-pc"

      - name: Verificar conexão
        run: |
          sleep 5

          IP=$(tailscale ip -4)

          echo ""
          echo "=========================================="
          echo "          PC VIRTUAL ONLINE"
          echo "=========================================="
          echo ""
          echo "ENDEREÇO PARA O WINDOWS APP:"
          echo "$IP"
          echo ""
          echo "PORTA:"
          echo "3389"
          echo ""
          echo "USUÁRIO:"
          echo "remote"
          echo ""
          echo "SENHA:"
          echo "A senha definida no Run workflow"
          echo ""
          echo "=========================================="

      - name: Manter máquina ligada
        run: |
          echo "PC virtual funcionando."

          while true; do
            echo "Online: $(date)"
            sleep 60
          done
