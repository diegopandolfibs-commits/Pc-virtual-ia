name: PC Virtual Ubuntu

on:
  workflow_dispatch:
    inputs:
      access_password:
        description: "Defina a senha para acessar o PC virtual"
        required: true
        default: "123456"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      - name: Instalar XFCE, xRDP e D-Bus
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xfce4-session \
            xrdp \
            dbus-x11 \
            dbus-user-session \
            policykit-1

      - name: Criar usuário remoto
        run: |
          sudo useradd -m -s /bin/bash remote || true

          echo "remote:${{ github.event.inputs.access_password }}" \
            | sudo chpasswd

          sudo usermod -aG sudo remote
          sudo usermod -aG ssl-cert xrdp

      - name: Configurar sessão XFCE
        run: |
          sudo mkdir -p /etc/xrdp

          sudo bash -c 'cat > /home/remote/.xsession' <<'EOF'
          #!/bin/bash

          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8

          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg
          export XDG_DATA_DIRS=/usr/share/xfce4:/usr/local/share:/usr/share

          dbus-launch --exit-with-session startxfce4
          EOF

          sudo chmod +x /home/remote/.xsession
          sudo chown remote:remote /home/remote/.xsession

      - name: Corrigir inicialização do xRDP
        run: |
          sudo cp /etc/xrdp/startwm.sh /etc/xrdp/startwm.sh.backup

          sudo bash -c 'cat > /etc/xrdp/startwm.sh' <<'EOF'
          #!/bin/sh

          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8

          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg
          export XDG_DATA_DIRS=/usr/share/xfce4:/usr/local/share:/usr/share

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          if [ -r /etc/profile ]; then
              . /etc/profile
          fi

          if [ -r "$HOME/.profile" ]; then
              . "$HOME/.profile"
          fi

          exec dbus-launch --exit-with-session startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

      - name: Iniciar xRDP
        run: |
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          sleep 3

          sudo systemctl --no-pager status xrdp || true

      - name: Instalar Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Conectar ao Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="github-pc"

      - name: Mostrar informações
        run: |
          sleep 5

          IP=$(tailscale ip -4)

          echo ""
          echo "=========================================="
          echo "          PC VIRTUAL ONLINE"
          echo "=========================================="
          echo ""
          echo "IP:"
          echo "$IP"
          echo ""
          echo "PORTA RDP:"
          echo "3389"
          echo ""
          echo "USUÁRIO:"
          echo "remote"
          echo ""
          echo "SENHA:"
          echo "A senha definida no Run workflow"
          echo ""
          echo "WINDOWS APP:"
          echo "$IP"
          echo ""
          echo "=========================================="

      - name: Manter máquina ligada
        run: |
          echo "PC virtual funcionando..."

          while true; do
            echo "Online: $(date)"
            sleep 60
          done
