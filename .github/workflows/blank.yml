name: PC Virtual Ubuntu

on:
  workflow_dispatch:
    inputs:
      access_password:
        description: "Defina a senha para acessar o PC virtual"
        required: true
        default: "123456"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      - name: Instalar ambiente gráfico e VNC
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            tigervnc-standalone-server \
            tigervnc-tools \
            dbus-x11 \
            curl

      - name: Configurar senha do VNC
        run: |
          mkdir -p "$HOME/.vnc"

          printf '%s\n' "${{ github.event.inputs.access_password }}" \
            | vncpasswd -f > "$HOME/.vnc/passwd"

          chmod 600 "$HOME/.vnc/passwd"

      - name: Configurar XFCE
        run: |
          cat > "$HOME/.vnc/xstartup" <<'EOF'
          #!/bin/sh

          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS

          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce

          exec dbus-launch --exit-with-session startxfce4
          EOF

          chmod +x "$HOME/.vnc/xstartup"

      - name: Instalar Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Conectar ao Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="github-pc"

      - name: Iniciar VNC
        run: |
          vncserver :1 \
            -geometry 1280x720 \
            -depth 24

      - name: Mostrar informações de acesso
        run: |
          sleep 5

          IP=$(tailscale ip -4)

          echo ""
          echo "=========================================="
          echo "          PC VIRTUAL ONLINE"
          echo "=========================================="
          echo ""
          echo "IP TAILSCALE:"
          echo "$IP"
          echo ""
          echo "PORTA VNC:"
          echo "5901"
          echo ""
          echo "ENDEREÇO:"
          echo "$IP:5901"
          echo ""
          echo "SENHA:"
          echo "A senha definida no Run workflow"
          echo ""
          echo "=========================================="

      - name: Manter máquina ligada
        run: |
          echo "PC virtual funcionando."
          echo "Não encerre o workflow."

          while true; do
            echo "Online: $(date)"
            sleep 60
          done
